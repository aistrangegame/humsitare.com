<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Room's Flame</title>
<link rel="stylesheet" href="../film/fonts.css">
<style>
:root{color-scheme:dark;--u:min(1vw,1.7778vh);--cream:#f6ecd8;--gold:#f2d29a;--deep:#05030a}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.hide{cursor:none}
#b-stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;pointer-events:none;color:var(--cream)}
/* rest: the invitation and the nine lamps' names */
#invite{left:0;right:0;top:61%;text-align:center;text-shadow:0 2px 30px rgba(5,3,10,.95)}
#invite .en{margin:0;font:italic 400 calc(var(--u)*3.1)/1.1 "Lora",serif;letter-spacing:.01em}
#invite .hi{margin:.35em 0 0;font:400 calc(var(--u)*2.05)/1.3 "Tiro Devanagari Hindi",serif;color:var(--gold)}
#lamps{position:fixed;left:0;right:0;top:68%;bottom:0;display:flex;justify-content:center}
.lamp{all:unset;box-sizing:border-box;position:relative;width:10%;height:100%;cursor:pointer;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4.2vh;color:var(--cream);text-align:center}
.lamp .d{font:400 calc(var(--u)*2.15)/1.25 "Tiro Devanagari Hindi",serif;white-space:nowrap;text-shadow:0 2px 16px rgba(5,3,10,.95)}
.lamp .r{margin-top:.25em;font:400 calc(var(--u)*1.2)/1.2 "Lora",serif;letter-spacing:.05em;color:var(--gold);white-space:nowrap;text-shadow:0 2px 12px rgba(5,3,10,.95)}
.lamp:focus-visible{outline:2px solid rgba(242,210,154,.5);outline-offset:-6px;border-radius:24px}
body:not(.rest) #lamps{pointer-events:none}
/* scene: the words and the Do card */
#words{left:6%;top:20%;width:42%;text-shadow:0 2px 24px rgba(5,3,10,.95),0 0 60px rgba(5,3,10,.85)}
#words::before{content:"";position:absolute;inset:-30% -18% -30% -14%;z-index:-1;background:radial-gradient(ellipse 60% 55% at 40% 50%,rgba(6,4,12,.62),rgba(6,4,12,.3) 55%,rgba(6,4,12,0) 80%)}
#w-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35em .7em;margin:0 0 .35em}
#w-deva{font:400 calc(var(--u)*3.6)/1.05 "Rozha One","Tiro Devanagari Hindi",serif}
#w-name{font:400 calc(var(--u)*1.55)/1.2 "Lora",serif;letter-spacing:.06em;color:var(--gold)}
#w-q{margin:0;font:italic 400 calc(var(--u)*4.5)/1.06 "Lora",serif;text-wrap:balance}
#card{left:6%;bottom:12.5vh;width:49%;box-sizing:border-box;padding:calc(var(--u)*1.7) calc(var(--u)*2.1) calc(var(--u)*1.9);
  border-radius:calc(var(--u)*1.4);background:linear-gradient(180deg,rgba(14,9,24,.86),rgba(8,5,14,.9));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c,#f2d29a) 55%,transparent),0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,210,.08);
  opacity:0;will-change:transform,opacity}
#card::before{content:"";position:absolute;left:calc(var(--u)*2.1);right:calc(var(--u)*2.1);top:0;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,transparent,var(--c,#f2d29a) 18%,var(--c,#f2d29a) 82%,transparent)}
#card .lbl{margin:0 0 calc(var(--u)*.9);font:500 calc(var(--u)*1.05)/1 "DM Sans",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#E8CF92}
#card .cols{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.6)}
#card .col{position:relative}
#card .col+.col::before{content:"";position:absolute;left:calc(var(--u)*-1.3);top:.3em;bottom:.3em;width:1px;background:rgba(242,210,154,.22)}
#card h2{margin:0 0 .45em;font:italic 600 calc(var(--u)*2.05)/1.18 "Lora",serif;color:#FBF3E4;text-wrap:balance}
#card p.b{margin:0;font:400 calc(var(--u)*1.42)/1.45 "Lora",serif;color:#EADFCB}
#card .hi h2{font:400 calc(var(--u)*2.0)/1.35 "Tiro Devanagari Hindi",serif;color:#FBF3E4}
#card .hi p.b{font:400 calc(var(--u)*1.45)/1.6 "Tiro Devanagari Hindi",serif}
#prog{position:fixed;left:0;right:0;bottom:0;height:4px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,var(--c,#f2d29a) var(--p,0%),rgba(255,255,255,.07) var(--p,0%))}
/* back */
#back{all:unset;position:fixed;left:max(28px,2.2vw);bottom:max(28px,2.6vh);width:max(96px,calc(var(--u)*5.6));height:max(96px,calc(var(--u)*5.6));
  border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:none;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(40,28,52,.92),rgba(12,8,20,.92));box-shadow:0 0 0 2px rgba(242,210,154,.75),0 10px 40px rgba(0,0,0,.6),0 0 40px rgba(242,210,154,.18);
  transition:opacity .35s ease,transform .2s ease}
#back svg{width:46%;height:46%}
#back.on{opacity:1;pointer-events:auto}
#back:active{transform:scale(.94)}
#film-stub{display:none}
</style></head>
<body class="rest">
<canvas id="b-stage" aria-label="The room's flame: nine lamps and one light"></canvas>
<div id="invite" class="ov"><p class="en">Touch a lamp</p><p class="hi">किसी दीये को छुएँ</p></div>
<nav id="lamps" aria-label="Nine lamps"></nav>
<div id="words" class="ov" aria-live="polite"><div id="w-head"><span id="w-deva"></span><span id="w-name"></span></div><p id="w-q"></p></div>
<section id="card" class="ov" aria-live="polite">
  <p class="lbl">Do this tonight</p>
  <div class="cols"><div class="col en"><h2 id="c-t"></h2><p class="b" id="c-b"></p></div>
  <div class="col hi" lang="hi"><h2 id="c-ht"></h2><p class="b" id="c-hb"></p></div></div>
</section>
<div id="prog"></div>
<button id="back" aria-label="Back"><svg viewBox="0 0 48 48" fill="none" stroke="#F6E7C6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M28 12 16 24l12 12"/><path d="M17 24h17"/></svg></button>

<!-- the film's engine is loaded only for its PANELS (one source of the words); its own stage is this hidden stub and it is never started -->
<div id="film-stub"><canvas id="stage"></canvas><div id="intro"></div><div id="outro"></div><div id="words-f"></div><div id="corner"></div></div>
<script>
// keep the film engine's keyboard seek (it has no plan here) from firing; register before engine.js
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' ') e.stopImmediatePropagation(); },true);
// the engine looks up these ids; give it inert elements
['words','w-head','w-deva','w-name','w-q','w-seed','card'].forEach(id=>{ const real=document.getElementById(id); if(real){ real.dataset.board=id; real.id='b-'+id; } const s=document.createElement('div'); s.id=id; document.getElementById('film-stub').appendChild(s); });
</script>
<script src="../film/engine.js"></script>
<script>
// restore the board's own ids, then put the shim in place: scenes register here
document.querySelectorAll('[data-board]').forEach(el=>{ document.getElementById('film-stub').querySelector('#'+el.dataset.board)?.remove(); el.id=el.dataset.board; });
(()=>{ const ENGINE=window.FILM; window.BOARD_REG={}; window.FILM={ PANELS:ENGINE.PANELS, scene(def){ window.BOARD_REG[def.id]=def; } };
  const st=document.getElementById('stage'); st.width=st.height=1; })();
</script>
<script src="../film/scenes/muladhara.js"></script>
<script src="../film/scenes/svadhisthana.js"></script>
<script src="../film/scenes/manipura.js"></script>
<script src="../film/scenes/anahata.js"></script>
<script src="../film/scenes/vishuddha.js"></script>
<script src="../film/scenes/ajna.js"></script>
<script src="../film/scenes/sahasrara.js"></script>
<script src="../film/scenes/aatma.js"></script>
<script src="../film/scenes/maya.js"></script>
<script src="board.js"></script>
</body></html>
