<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carry the Light</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#05030a;overflow:hidden;cursor:default}
body.hide{cursor:none}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.w{position:fixed;color:#f6ecd8;text-shadow:0 2px 24px rgba(5,3,10,.95),0 0 60px rgba(5,3,10,.8);pointer-events:none}
#words{left:7%;top:62%;width:42%}
#w-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4em .7em;margin:0 0 .5em;transition:none}
#w-deva{font:400 clamp(28px,3.2vw,64px)/1 "Rozha One","Tiro Devanagari Hindi",serif}
#w-name{font:400 clamp(16px,1.35vw,28px)/1.2 "Lora",serif;letter-spacing:.06em;color:#f2d29a}
#w-q{margin:0;font:italic 400 clamp(36px,4.6vw,96px)/1.06 "Lora",serif;text-wrap:balance}
#w-seed{margin:.9em 0 0;font:italic 400 clamp(17px,1.6vw,34px)/1.35 "Lora",serif;color:#f2d29a;text-wrap:balance;max-width:30em}
#words.center #w-head{justify-content:center}
#intro,#outro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
#intro p,#outro p{margin:0}
#intro .t{position:absolute;top:66%;font:italic 400 clamp(22px,2.4vw,48px)/1.3 "Lora",serif}
#intro .s{position:absolute;top:75%;font:400 clamp(13px,1vw,20px)/1.4 "DM Sans",sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#f2d29a}
#outro .t{position:absolute;top:64%;font:italic 400 clamp(40px,5vw,110px)/1 "Lora",serif}
#corner{right:1.6vw;bottom:2.4vh;display:flex;align-items:center;gap:1.1vw;opacity:0;transition:opacity 1.4s;text-shadow:none;padding:.9vw 1.4vw .9vw .9vw;border-radius:14px;background:rgba(12,8,22,.82);box-shadow:0 0 0 1px rgba(201,168,76,.35),0 10px 40px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
#corner canvas{width:clamp(96px,11vh,180px);height:auto;border-radius:8px;box-shadow:0 0 0 1px rgba(201,168,76,.6),0 8px 30px rgba(0,0,0,.5)}
#corner p{margin:0}
#corner .c1{font:500 clamp(14px,1.3vw,26px)/1.2 "Noto Sans Devanagari","Lora",serif;color:#E8CF92}
#corner .c2{font:italic 400 clamp(16px,1.6vw,32px)/1.25 "Lora",serif;color:#FBF3E4;margin-top:.2em}
#corner .c3{font:400 clamp(11px,.9vw,18px)/1.3 "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C9A84C;margin-top:.35em}
[data-screen="entrance"] #w-q{font-size:clamp(44px,5.6vw,120px)}
[data-screen="entrance"] #w-seed{font-size:clamp(20px,2vw,42px)}
[data-screen="entrance"] #w-name{font-size:clamp(18px,1.7vw,34px)}
#card{position:fixed;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--c,#f2d29a) var(--p,0%),rgba(255,255,255,.06) var(--p,0%));opacity:0;transition:opacity 1.2s}
</style></head><body>
<canvas id="stage" aria-label="Carry the Light: nine lamps, one light"></canvas>
<div id="intro" class="w"><p class="t">Nine trees. One person, from the ground up.</p><p class="s">Carry the light</p></div>
<div id="words" class="w"><div id="w-head"><span id="w-deva"></span><span id="w-name"></span></div><p id="w-q"></p><p id="w-seed"></p></div>
<div id="outro" class="w"><p class="t">Now go play.</p></div>
<div id="card"></div>
<div id="corner" class="w"><canvas id="corner-qr" width="240" height="240"></canvas><div><p class="c1">हम सितारे · Diwali 2026</p><p class="c2">Share your photos tonight</p><p class="c3">Scan to open the album</p></div></div>
<script src="qr-photos.js"></script>
<script src="engine.js"></script>
<script>(()=>{const c=document.getElementById("corner-qr"),x=c.getContext("2d"),Q=window.PHOTOS_QR,n=Q.length,m=240/(n+8);x.fillStyle="#FBF3E4";x.fillRect(0,0,240,240);x.fillStyle="#14102A";for(let y=0;y<n;y++)for(let i=0;i<n;i++)if(Q[y][i]==="1")x.fillRect(Math.floor((i+4)*m),Math.floor((y+4)*m),Math.ceil(m),Math.ceil(m));})();</script>
<!--SCENES-->
<script src="scenes/_list.js"></script>
</body></html>
